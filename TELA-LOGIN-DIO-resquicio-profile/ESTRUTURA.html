          <span><b>${D.resumo.entradas}</b> galhos${D.resumo.galhosQuebrados ? ` (<b style="color:var(--erro)">${D.resumo.galhosQuebrados}</b> quebrados)` : ''}</span>
          <span title="${esc(D.verificador.sintaxe)}${D.verificador.python ? ` · ${esc(D.verificador.python)}` : ''}">sintaxe: ${esc(D.verificador.sintaxe.split(' (')[0])}</span>
        </div>
        <div class="stack">${D.projeto.stack.map((s) => `<span>${esc(s)}</span>`).join('')}</div>
      </header>
      ${m && m.quebrasNovas ? `<div class="faixa quebrou"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3zM12 10v4M12 17.5v.5"/></svg>${plural(m.quebrasNovas, 'quebra nova', 'quebras novas')} desde a leitura de ${dataHora(m.desde)}<button data-ir="mudancas">Ver o que mudou</button></div>`
        : m && m.resolvidas.length ? `<div class="faixa resolveu"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>${plural(m.resolvidas.length, 'problema resolvido', 'problemas resolvidos')} desde ${dataHora(m.desde)}<button data-ir="mudancas">Ver</button></div>` : ''}
      <div class="corpo">
        <aside class="lado">
          <nav class="abas" role="tablist">
            <button class="aba" role="tab" data-aba="problemas">Problemas <span class="n ${erros ? 'erro' : ''}">${erros + avisos}</span></button>
            <button class="aba" role="tab" data-aba="galhos">Galhos <span class="n">${D.resumo.entradas}</span></button>
            <button class="aba" role="tab" data-aba="arquivos">Arquivos</button>
            <button class="aba" role="tab" data-aba="mudancas">Mudanças</button>
          </nav>
          <label class="busca"><input id="busca" type="search" placeholder="Filtrar…" autocomplete="off" aria-label="Filtrar"></label>
          <div class="lista" id="lista"></div>
        </aside>
        <main class="area">
          <div class="cabeca-grafo">
            <div><h2 id="tituloGrafo">Estrutura</h2><div class="sub" id="subGrafo"></div></div>
            <span class="esp"></span>
            <label class="alternar"><input type="checkbox" id="optPacotes"> mostrar pacotes</label>
            <div class="leg">
              <span style="--c:${CORES.pagina}">página</span><span style="--c:${CORES.api}">API</span><span style="--c:${CORES.script}">script</span>
              <span style="--c:${CORES.componente}">componente</span><span style="--c:${CORES.lib}">lib</span><span style="--c:${CORES.modelo}">banco</span>
              <span style="--c:${CORES.env}">variável</span><span style="--c:${CORES.faltando}">não existe</span>
            </div>
          </div>
          <div class="quadro" id="quadro"><div class="palco" id="palco"><svg id="svg" width="1" height="1"></svg><div id="camadaNos"></div></div>
            <div class="vazio-grafo" id="vazioGrafo"><div><b>Escolha um galho ou um problema</b>O caminho aparece aqui, do início (esquerda) ao fim (direita).</div></div>
            <div class="aviso-limite" id="avisoLimite" hidden></div>
          </div>
          <div class="controles"><button id="zMenos" title="Afastar">−</button><button id="zValor" title="100%">100%</button><button id="zMais" title="Aproximar">+</button><button id="zAjustar" title="Ajustar à tela">Ajustar</button></div>
          <aside class="detalhe" id="detalhe" hidden></aside>
        </main>
      </div>
    </div>`;

  // ---------- listas ----------
  function corresponde(...textos) {
    const t = semAcento(ui.busca.trim());
    if (!t) return true;
    const alvo = semAcento(textos.join(' '));
    return t.split(/\s+/).every((p) => alvo.includes(p));
  }

  function renderLista() {
    for (const a of document.querySelectorAll('.aba')) a.setAttribute('aria-selected', String(a.dataset.aba === ui.aba));
    const lista = $('#lista');
    if (ui.aba === 'problemas') lista.innerHTML = htmlProblemas();
    else if (ui.aba === 'galhos') lista.innerHTML = htmlGalhos();
    else if (ui.aba === 'arquivos') lista.innerHTML = htmlArquivos();
    else lista.innerHTML = htmlMudancas();
  }

  function htmlProblemas() {
    const itens = D.problemas.map((p, i) => ({ p, i })).filter(({ p }) => corresponde(p.mensagem, p.arquivo, p.tipo));
    if (!D.problemas.length) return '<div class="vazio-lista">Nenhum problema encontrado nesta leitura.</div>';
    if (!itens.length) return '<div class="vazio-lista">Nada corresponde ao filtro.</div>';
    const grupo = (sev, titulo) => {
      const doGrupo = itens.filter(({ p }) => p.severidade === sev);
      if (!doGrupo.length) return '';
      return `<div class="grupo"><span>${titulo}</span><span>${doGrupo.length}</span></div>${doGrupo.slice(0, 400).map(({ p, i }) => `
        <button class="item problema ${ui.grafo && ui.grafo.problema === i ? 'ativo' : ''}" data-problema="${i}">
          <span class="ponto" style="--c:${sev === 'erro' ? 'var(--erro)' : 'var(--aviso)'}"></span>
          <span class="t">${esc(p.mensagem)}</span>
          <span class="c">${p.novo ? '<span class="selo novo">novo</span>' : ''}</span>
          <span class="s">${p.arquivo ? `${esc(p.arquivo)}${p.linha ? `:${p.linha}` : ''} · ` : ''}${p.galhos ? `afeta ${plural(p.galhos, 'galho', 'galhos')}` : 'fora dos galhos'} · desde ${dataHora(p.desde)}${p.daCompilacao ? ' · da compilação' : ''}</span>
        </button>`).join('')}`;
    };
    return grupo('erro', 'Quebras') + grupo('aviso', 'Avisos');
  }

  function htmlGalhos() {
    const grupos = [['pagina', 'Páginas'], ['api', 'Rotas de API'], ['middleware', 'Middleware'], ['html', 'Páginas HTML'], ['script', 'Scripts e comandos']];
    const partes = [];
    for (const [tipo, titulo] of grupos) {
      const doTipo = D.entradas.filter((e) => e.tipo === tipo && corresponde(nomeEntrada(e.no), nos[e.no].caminho, nos[e.no].comando));
      if (!doTipo.length) continue;
      const quebrados = doTipo.filter((e) => e.erros).length;
      partes.push(`<div class="grupo"><span>${titulo}</span><span>${quebrados ? `${quebrados} quebrado(s) · ` : ''}${doTipo.length}</span></div>`);
      partes.push(doTipo.slice(0, 600).map((e) => `
        <button class="item ${ui.grafo && ui.grafo.entrada === e.no ? 'ativo' : ''}" data-galho="${e.no}">
          <span class="ponto" style="--c:${e.erros ? 'var(--erro)' : e.avisos ? 'var(--aviso)' : 'var(--ok)'}"></span>
          <span class="t">${esc(nomeEntrada(e.no))}</span>
          <span class="c">${e.erros ? `<span class="selo erro">${e.erros}</span>` : ''}${e.avisos ? `<span class="selo aviso">${e.avisos}</span>` : ''}</span>
          <span class="s">${esc(nos[e.no].caminho || nos[e.no].comando || '')} · ${plural(e.alcance, 'peça', 'peças')}</span>
        </button>`).join(''));
    }
    return partes.join('') || '<div class="vazio-lista">Nenhum galho corresponde ao filtro.</div>';
  }

  function htmlArquivos() {
    const arvore = { pastas: new Map(), arquivos: [], erros: 0, avisos: 0 };
    nos.forEach((n, i) => {
      if (n.tipo !== 'arquivo' || !n.caminho || !corresponde(n.caminho)) return;
      const partes = n.caminho.split('/');
      let atual = arvore;
      const e = problemasDo[i].filter((pi) => D.problemas[pi].severidade === 'erro').length;
      const a = problemasDo[i].length - e;
      arvore.erros += e; arvore.avisos += a;
      for (const parte of partes.slice(0, -1)) {
        if (!atual.pastas.has(parte)) atual.pastas.set(parte, { pastas: new Map(), arquivos: [], erros: 0, avisos: 0 });
        atual = atual.pastas.get(parte);
        atual.erros += e; atual.avisos += a;
      }
      atual.arquivos.push({ i, nome: partes[partes.length - 1], e, a });
    });
    const filtrando = Boolean(ui.busca.trim());
    const html = [];
    const desenhar = (no, caminho, nivel) => {
      for (const [nome, sub] of [...no.pastas.entries()].sort((x, y) => x[0].localeCompare(y[0]))) {
        const chave = `${caminho}/${nome}`;
        const aberto = filtrando || ui.abertos.has(chave) || (nivel === 0 && no.pastas.size <= 3);
        html.push(`<button class="pasta-arvore" data-pasta="${esc(chave)}" style="padding-left:${6 + nivel * 14}px"><span class="seta">${aberto ? '▾' : '▸'}</span><span class="nome">${esc(nome)}</span>${sub.erros ? `<span class="selo erro">${sub.erros}</span>` : ''}${sub.avisos ? `<span class="selo aviso">${sub.avisos}</span>` : ''}</button>`);
        if (aberto) desenhar(sub, chave, nivel + 1);
      }
      for (const f of no.arquivos.sort((x, y) => x.nome.localeCompare(y.nome))) {
        html.push(`<button class="arquivo-arvore ${foraDosGalhos.has(f.i) ? 'fora' : ''}" data-no="${f.i}" style="padding-left:${22 + nivel * 14}px" title="${foraDosGalhos.has(f.i) ? 'Nenhum galho chega neste arquivo' : esc(nos[f.i].caminho)}"><span class="ponto" style="--c:${cor(nos[f.i])}"></span><span class="nome">${esc(f.nome)}</span>${f.e ? `<span class="selo erro">${f.e}</span>` : ''}${f.a ? `<span class="selo aviso">${f.a}</span>` : ''}</button>`);
      }
    };
    desenhar(arvore, '', 0);
    return (foraDosGalhos.size ? `<div class="vazio-lista" style="padding:8px 8px 4px">${plural(foraDosGalhos.size, 'arquivo de código fica', 'arquivos de código ficam')} fora de todos os galhos (em cinza): ninguém chega neles a partir de uma página, rota ou script.</div>` : '') + (html.join('') || '<div class="vazio-lista">Nada corresponde ao filtro.</div>');
  }

  function htmlMudancas() {
    if (!m) return '<div class="vazio-lista">Esta é a primeira leitura deste projeto. Nas próximas, aparece aqui o que mudou, o que quebrou e o que foi resolvido.</div>';
    const novos = D.problemas.map((p, i) => ({ p, i })).filter(({ p }) => p.novo);
    const lista = (arr, classe, sinal) => arr.slice(0, 80).map((r) => `<div class="linha-mud ${classe}" title="${esc(r)}">${sinal} ${esc(r)}</div>`).join('');
    return `
      <div class="secao-mud"><h3>Desde a leitura de ${dataHora(m.desde)}</h3></div>
      <div class="secao-mud"><h3>Quebrou (${novos.length})</h3>${novos.map(({ p, i }) => `<button class="item problema" data-problema="${i}"><span class="ponto" style="--c:${p.severidade === 'erro' ? 'var(--erro)' : 'var(--aviso)'}"></span><span class="t">${esc(p.mensagem)}</span><span class="c"></span><span class="s">${esc(p.arquivo || '')}${p.linha ? `:${p.linha}` : ''}</span></button>`).join('') || '<div class="vazio-lista">Nada novo quebrou.</div>'}</div>
      <div class="secao-mud"><h3>Resolvido (${m.resolvidas.length})</h3>${m.resolvidas.map((r) => `<div class="linha-mud mais" title="${esc(r.mensagem)}">✓ ${esc(r.mensagem)}</div>`).join('') || '<div class="vazio-lista">Nada resolvido.</div>'}</div>
      <div class="secao-mud"><h3>Arquivos: +${m.totais.adicionados} −${m.totais.removidos} ~${m.totais.alterados}</h3>${lista(m.adicionados, 'mais', '+')}${lista(m.removidos, 'menos', '−')}${lista(m.alterados, 'til', '~')}</div>
      <div class="secao-mud"><h3>Histórico de leituras</h3>
        <table class="hist"><tr><th>Quando</th><th>Quebras</th><th>Avisos</th><th>Novas</th><th>Resolvidas</th></tr>
        ${[...D.historico].reverse().map((h) => `<tr><td>${dataHora(h.quando)}</td><td style="color:${h.erros ? 'var(--erro)' : 'inherit'}">${h.erros}</td><td>${h.avisos}</td><td>${h.novas}</td><td>${h.resolvidas}</td></tr>`).join('')}</table>
      </div>`;
  }

  // ---------- grafos ----------
  const LARG = 230; const ALT = 58; const VAO_X = 90; const VAO_Y = 14; const LIMITE = 400;
  const visivelNoGrafo = (i) => ui.pacotes || nos[i].tipo !== 'pacote' || nos[i].naoInstalado;

  function entradasQueAlcancam(alvo) {
    const visto = new Uint8Array(nos.length);
    const fila = [alvo];
    visto[alvo] = 1;
    const achadas = [];
    while (fila.length) {
      const v = fila.shift();
      if (tipoEntrada.has(v)) achadas.push(v);
      for (const [w] of chegam[v]) if (!visto[w]) { visto[w] = 1; fila.push(w); }
    }
    return achadas.sort((a, b) => (tipoEntrada.get(b).erros - tipoEntrada.get(a).erros));
  }

  function montarGalho(entrada) {
    const prof = new Map([[entrada, 0]]);
    const pai = new Map();
    const fila = [entrada];
    let total = 1;
    while (fila.length) {
      const v = fila.shift();
      for (const [w] of saem[v]) {
        if (prof.has(w) || !visivelNoGrafo(w)) continue;
        total++;
        if (prof.size >= LIMITE) continue;
        prof.set(w, prof.get(v) + 1);
        pai.set(w, v);
        fila.push(w);
      }
    }
    return { prof, pai, total };
  }

  function montarVizinhanca(centro) {
    const prof = new Map([[centro, 0]]);
    const pai = new Map();
    const andar = (lista, sinal) => {
      let fronteira = [centro];
      for (let d = 1; d <= 2; d++) {
        const prox = [];
        for (const v of fronteira) {
          for (const [w] of lista(v)) {
            if (prof.has(w) || !visivelNoGrafo(w) || prof.size >= LIMITE) continue;
            prof.set(w, sinal * d);
            pai.set(w, v);
            prox.push(w);
          }
        }
        fronteira = prox;
      }
    };
    andar((v) => saem[v], 1);
    andar((v) => chegam[v], -1);
    return { prof, pai, total: prof.size };
  }

  function abrirGalho(entrada, destaque = null, problema = null) {
    const g = montarGalho(entrada);
    const e = tipoEntrada.get(entrada);
    ui.grafo = { tipo: 'galho', entrada, destaque, problema, ...g };
    $('#tituloGrafo').textContent = `Galho: ${nomeEntrada(entrada)}`;
    $('#subGrafo').textContent = `${nos[entrada].caminho || nos[entrada].comando || ''} · ${plural(g.total, 'peça', 'peças')}${e && e.erros ? ` · ${plural(e.erros, 'quebra alcançada', 'quebras alcançadas')}` : ' · sem quebras'}`;
    desenharGrafo();
  }

  function abrirVizinhanca(centro, problema = null) {
    const g = montarVizinhanca(centro);
    ui.grafo = { tipo: 'vizinhanca', centro, destaque: centro, problema, ...g };
    $('#tituloGrafo').textContent = `Em volta de ${nos[centro].rotulo}`;
    $('#subGrafo').textContent = `quem usa (esquerda) · o que ele usa (direita)${foraDosGalhos.has(centro) ? ' · nenhum galho chega aqui' : ''}`;
    desenharGrafo();
  }

  function abrirProblema(i) {
    const p = D.problemas[i];
    const entradas = entradasQueAlcancam(p.no);
    // o detalhe abre antes: o enquadramento já desconta a largura dele
    abrirDetalhe(p.no);
    if (entradas.length) abrirGalho(entradas[0], p.no, i);
    else abrirVizinhanca(p.no, i);
    renderLista();
  }

  function desenharGrafo() {
    const g = ui.grafo;
    const colunas = new Map();
    const fim = g.tipo === 'galho' ? Math.max(0, ...[...g.prof.values()]) + 1 : null;
    for (const [i, d] of g.prof) {
      const col = g.tipo === 'galho' && RECURSO.has(nos[i].tipo) ? fim : d;
      if (!colunas.has(col)) colunas.set(col, []);
      colunas.get(col).push(i);
    }
    const ordemPapel = ['pagina', 'api', 'script', 'html', 'middleware', 'layout', 'componente', 'hook', 'lib', 'modulo', 'estilo', 'dados', 'config', 'teste', 'faltando', 'modelo', 'env', 'externo', 'pacote'];
    const chaves = [...colunas.keys()].sort((a, b) => a - b);
    // coluna alta vira blocos lado a lado (até 14 peças cada): o galho abre largo, não uma torre fina
    const MAX_POR_BLOCO = 14;
    const VAO_BLOCO = 24;
    const porBloco = (n) => Math.ceil(n / Math.ceil(n / MAX_POR_BLOCO));
    const alturaMax = Math.max(...chaves.map((k) => porBloco(colunas.get(k).length))) * (ALT + VAO_Y);
    const pos = new Map();
    const xColuna = new Map();
    let xAtual = 0;
    chaves.forEach((k) => {
      const lista = colunas.get(k).sort((a, b) => (problemasDo[b].length - problemasDo[a].length) || ordemPapel.indexOf(papel(nos[a])) - ordemPapel.indexOf(papel(nos[b])) || String(nos[a].rotulo).localeCompare(String(nos[b].rotulo)));
      const tamBloco = porBloco(lista.length);
      const blocos = Math.ceil(lista.length / tamBloco);
      xColuna.set(k, xAtual);
      lista.forEach((i, li) => {
        const b = Math.floor(li / tamBloco);
        const noBloco = Math.min(tamBloco, lista.length - b * tamBloco);
        const altura = noBloco * (ALT + VAO_Y);
        pos.set(i, { x: xAtual + b * (LARG + VAO_BLOCO), y: (alturaMax - altura) / 2 + (li % tamBloco) * (ALT + VAO_Y) + 26 });
      });
      xAtual += blocos * (LARG + VAO_BLOCO) - VAO_BLOCO + VAO_X;
    });

    // caminho do início até o que está em destaque
    const noCaminho = new Set();
    const arestaCaminho = new Set();
    if (g.destaque != null && g.pai) {
      let v = g.destaque;
      noCaminho.add(v);
      while (g.pai.has(v)) { const p = g.pai.get(v); arestaCaminho.add(`${p}>${v}`); arestaCaminho.add(`${v}>${p}`); noCaminho.add(p); v = p; }
    }

    const titulos = g.tipo === 'galho'
      ? chaves.map((k) => `<div class="coluna-titulo" style="left:${xColuna.get(k)}px;top:0">${k === 0 ? 'início' : k === fim ? 'fim: recursos' : `passo ${k}`}</div>`)
      : chaves.map((k) => `<div class="coluna-titulo" style="left:${xColuna.get(k)}px;top:0">${k < 0 ? (k === -1 ? 'quem usa' : 'mais acima') : k === 0 ? 'este' : k === 1 ? 'ele usa' : 'mais abaixo'}</div>`);

    $('#camadaNos').innerHTML = titulos.join('') + [...pos.entries()].map(([i, p]) => {
      const n = nos[i];
      const pe = problemasDo[i].filter((pi) => D.problemas[pi].severidade === 'erro').length;
      const pa = problemasDo[i].length - pe;
      const cls = ['no'];
      if (tipoEntrada.has(i) && (g.entrada === i || g.centro === i)) cls.push('entrada');
      if (pe) cls.push('tem-erro');
      if (n.tipo === 'faltando') cls.push('faltando');
      if (noCaminho.has(i)) cls.push('no-caminho');
      if (ui.selecionado === i) cls.push('selecionado');
      return `<div class="${cls.join(' ')}" data-no="${i}" style="left:${p.x}px;top:${p.y}px;--c:${cor(n)}" title="${esc(n.caminho || n.rotulo)}">
        <span class="faixa-cor"></span>
        <span class="txt"><span class="r">${esc(tipoEntrada.has(i) ? nomeEntrada(i) : n.rotulo)}</span><span class="d">${esc(n.tipo === 'faltando' ? 'não existe' : subtitulo(n))}</span></span>
        <span class="badges">${pe ? `<span class="selo erro">${pe}</span>` : ''}${pa ? `<span class="selo aviso">${pa}</span>` : ''}${n.naoInstalado ? '<span class="selo aviso">não instalado</span>' : ''}</span>
      </div>`;
    }).join('');

    const caminhos = [];
    for (const [i, p] of pos) {
      for (const [w, tipo] of saem[i]) {
        const q = pos.get(w);
        if (!q) continue;
        const x1 = p.x + LARG; const y1 = p.y + ALT / 2; const x2 = q.x; const y2 = q.y + ALT / 2;
        const volta = x2 <= x1;
        const k = Math.max(40, Math.abs(x2 - x1) * 0.45);
        const d = volta
          ? `M${p.x + LARG / 2},${p.y + ALT} C${p.x + LARG / 2},${p.y + ALT + 60} ${q.x + LARG / 2},${q.y + ALT + 60} ${q.x + LARG / 2},${q.y + ALT}`
          : `M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2},${y2}`;
        const cls = ['aresta'];
        if (RECURSO.has(nos[w].tipo)) cls.push('recurso');
        if (nos[w].tipo === 'faltando') cls.push('quebrada');
        if (arestaCaminho.has(`${i}>${w}`)) cls.push('caminho');
        caminhos.push(`<path class="${cls.join(' ')}" d="${d}"><title>${esc(NOMES_ARESTA[tipo] || tipo)}</title></path>`);
      }
    }
    $('#svg').innerHTML = caminhos.join('');
    $('#vazioGrafo').hidden = true;
    const limite = $('#avisoLimite');
    limite.hidden = g.total <= pos.size;
    limite.textContent = `Galho grande: mostrando ${pos.size} de ${g.total} peças`;
    ui.posicoes = pos;
    ajustar(g.destaque != null ? g.destaque : null);
  }

  // ---------- câmera ----------
  function aplicarCamera() {
    const c = ui.camera;
    const dpr = window.devicePixelRatio || 1;
    $('#palco').style.transform = `translate(${Math.round(c.x * dpr) / dpr}px, ${Math.round(c.y * dpr) / dpr}px) scale(${c.z})`;
    $('#quadro').style.backgroundSize = `${22 * c.z}px ${22 * c.z}px`;
    $('#quadro').style.backgroundPosition = `${c.x}px ${c.y}px`;
    $('#zValor').textContent = `${Math.round(c.z * 100)}%`;
  }
  function ajustar(focar) {
    const pos = ui.posicoes;
    if (!pos || !pos.size) return;
    const r = $('#quadro').getBoundingClientRect();
    const larguraLivre = r.width - ($('#detalhe').hidden || window.innerWidth <= 900 ? 0 : $('#detalhe').offsetWidth);
    let x0 = Infinity; let y0 = 0; let x1 = -Infinity; let y1 = -Infinity;
    for (const p of pos.values()) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + LARG); y1 = Math.max(y1, p.y + ALT); }
    const z = Math.min(1, Math.max(0.15, Math.min((larguraLivre - 60) / (x1 - x0), (r.height - 60) / (y1 - y0))));
    const c = ui.camera;
    c.z = z;
    c.x = (larguraLivre - (x1 - x0) * z) / 2 - x0 * z;
    c.y = Math.max(20, (r.height - (y1 - y0) * z) / 2) - y0 * z;
    if (focar != null && pos.get(focar) && z < 0.55) {
      const p = pos.get(focar);
      c.z = 0.75;
      c.x = larguraLivre / 2 - (p.x + LARG / 2) * c.z;
      c.y = r.height / 2 - (p.y + ALT / 2) * c.z;
    }
    aplicarCamera();
    if (focar != null) {
      const el = document.querySelector(`.no[data-no="${focar}"]`);
      if (el) { el.classList.remove('destaque'); void el.offsetWidth; el.classList.add('destaque'); }
    }
  }
  function zoom(fator, cx, cy) {
    const c = ui.camera;
    const r = $('#quadro').getBoundingClientRect();
    const px = cx == null ? r.width / 2 : cx - r.left;
    const py = cy == null ? r.height / 2 : cy - r.top;
    const z = Math.min(2, Math.max(0.1, c.z * fator));
    c.x = px - ((px - c.x) * z) / c.z;
    c.y = py - ((py - c.y) * z) / c.z;
    c.z = z;
    aplicarCamera();
  }

  // ---------- detalhe ----------
  function abrirDetalhe(i) {
    ui.selecionado = i;
    document.querySelectorAll('.no.selecionado').forEach((el) => el.classList.remove('selecionado'));
    const el = document.querySelector(`.no[data-no="${i}"]`);
    if (el) el.classList.add('selecionado');
    const n = nos[i];
    const refs = (lista, max = 40) => lista.slice(0, max).map(([w, tipo]) => `<button class="ref" data-foco="${w}" style="--c:${cor(nos[w])}"><span class="ponto"></span><span class="nome">${esc(nos[w].caminho || nos[w].rotulo)}</span><span class="tipo-ref">${esc(NOMES_ARESTA[tipo] || '')}</span></button>`).join('') + (lista.length > max ? `<div class="rodape-info">e mais ${lista.length - max}…</div>` : '');
    const entradas = entradasQueAlcancam(i).slice(0, 25);
    const det = $('#detalhe');
    det.innerHTML = `
      <header style="--c:${cor(n)}">
        <div class="linha"><span class="tipo">${esc(tipoEntrada.has(i) ? `Início de galho · ${NOMES_PAPEL[papel(n)] || ''}` : NOMES_PAPEL[papel(n)] || n.tipo)}</span><button class="fechar" data-fechar aria-label="Fechar">✕</button></div>
        <h3>${esc(tipoEntrada.has(i) ? nomeEntrada(i) : n.rotulo)}</h3>
        ${n.caminho ? `<div class="caminho">${esc(n.caminho)}</div>` : ''}
        ${n.comando ? `<div class="caminho">${esc(n.comando)}</div>` : ''}
        ${n.linhas ? `<div class="caminho">${n.linhas} linhas</div>` : ''}
      </header>
      ${problemasDo[i].length ? `<section><h4>O que quebrou aqui</h4>${problemasDo[i].map((pi) => { const p = D.problemas[pi]; return `<div class="prob ${p.severidade}">${esc(p.mensagem)}<span class="onde">${esc(p.arquivo || '')}${p.linha ? `:${p.linha}` : ''} · desde ${dataHora(p.desde)}${p.novo ? ' · novo' : ''}</span></div>`; }).join('')}</section>` : ''}
      <section><h4>Galhos que passam por aqui (${entradasQueAlcancam(i).length})</h4>${entradas.map((e) => `<button class="ref" data-galho="${e}" style="--c:${tipoEntrada.get(e).erros ? 'var(--erro)' : 'var(--ok)'}"><span class="ponto"></span><span class="nome">${esc(nomeEntrada(e))}</span></button>`).join('') || '<div class="rodape-info">Nenhum: nada começa um caminho até aqui.</div>'}</section>
      <section><h4>Usa (${saem[i].length})</h4>${refs(saem[i]) || '<div class="rodape-info">Nada.</div>'}</section>
      <section><h4>Usado por (${chegam[i].length})</h4>${refs(chegam[i]) || '<div class="rodape-info">Ninguém.</div>'}</section>
      <section><div class="botoes"><button class="btn" data-vizinhanca="${i}">Ver em volta deste</button>${entradas.length ? `<button class="btn" data-galho="${entradas[0]}">Abrir o galho${tipoEntrada.get(entradas[0]).erros ? ' mais quebrado' : ''}</button>` : ''}${n.caminho ? `<button class="btn" data-copiar="${esc(n.caminho)}">Copiar caminho</button>` : ''}</div></section>`;
    det.hidden = false;
  }

  // ---------- eventos ----------
  document.addEventListener('click', (ev) => {
    const alvo = ev.target.closest('[data-aba],[data-problema],[data-galho],[data-no],[data-pasta],[data-foco],[data-vizinhanca],[data-fechar],[data-copiar],[data-ir]');
    if (!alvo) return;
    const d = alvo.dataset;
    if (d.aba) { ui.aba = d.aba; renderLista(); }
    else if (d.ir) { ui.aba = d.ir; renderLista(); }
    else if (d.problema) abrirProblema(Number(d.problema));
    else if (d.galho) { abrirGalho(Number(d.galho)); renderLista(); }
    else if (d.pasta) { if (ui.abertos.has(d.pasta)) ui.abertos.delete(d.pasta); else ui.abertos.add(d.pasta); renderLista(); }
    else if (d.fechar !== undefined) { $('#detalhe').hidden = true; ui.selecionado = null; document.querySelectorAll('.no.selecionado').forEach((el) => el.classList.remove('selecionado')); }
    else if (d.copiar) { navigator.clipboard && navigator.clipboard.writeText(d.copiar); alvo.textContent = 'Copiado'; }
    else if (d.vizinhanca) { abrirDetalhe(Number(d.vizinhanca)); abrirVizinhanca(Number(d.vizinhanca)); }
    else if (d.foco) {
      const w = Number(d.foco);
      if (ui.posicoes && ui.posicoes.has(w)) { abrirDetalhe(w); ajustarPara(w); }
      else { abrirDetalhe(w); abrirVizinhanca(w); }
    } else if (d.no) {
      const i = Number(d.no);
      if (alvo.classList.contains('arquivo-arvore')) { abrirDetalhe(i); abrirVizinhanca(i); } else abrirDetalhe(i);
    }
  });
  function ajustarPara(i) {
    const p = ui.posicoes.get(i);
    const r = $('#quadro').getBoundingClientRect();
    const c = ui.camera;
    c.x = r.width / 2 - (p.x + LARG / 2) * c.z - ($('#detalhe').hidden ? 0 : 200);
    c.y = r.height / 2 - (p.y + ALT / 2) * c.z;
    aplicarCamera();
  }
  let timerBusca = null;
  $('#busca').addEventListener('input', (ev) => { ui.busca = ev.target.value; clearTimeout(timerBusca); timerBusca = setTimeout(renderLista, 120); });
  $('#optPacotes').addEventListener('change', (ev) => {
    ui.pacotes = ev.target.checked;
    const g = ui.grafo;
    if (!g) return;
    if (g.tipo === 'galho') abrirGalho(g.entrada, g.destaque, g.problema); else abrirVizinhanca(g.centro, g.problema);
  });
  $('#zMais').onclick = () => zoom(1.25);
  $('#zMenos').onclick = () => zoom(0.8);
  $('#zValor').onclick = () => zoom(1 / ui.camera.z);
  $('#zAjustar').onclick = () => ajustar(null);

  const quadro = $('#quadro');
  let arrasto = null;
  quadro.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.no')) return;
    arrasto = { x: ev.clientX, y: ev.clientY, cx: ui.camera.x, cy: ui.camera.y };
    quadro.classList.add('movendo');
    try { quadro.setPointerCapture(ev.pointerId); } catch (e) { /* ignora */ }
  });
  quadro.addEventListener('pointermove', (ev) => {
    if (!arrasto) return;
    ui.camera.x = arrasto.cx + ev.clientX - arrasto.x;
    ui.camera.y = arrasto.cy + ev.clientY - arrasto.y;
    aplicarCamera();
  });
  const soltar = () => { arrasto = null; quadro.classList.remove('movendo'); };
  quadro.addEventListener('pointerup', soltar);
  quadro.addEventListener('pointercancel', soltar);
  quadro.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    if (ev.ctrlKey || Math.abs(ev.deltaY) >= 50 && ev.deltaX === 0) zoom(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018)), ev.clientX, ev.clientY);
    else { ui.camera.x -= ev.deltaX; ui.camera.y -= ev.deltaY; aplicarCamera(); }
  }, { passive: false });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { $('#detalhe').hidden = true; }
    if (ev.key === '/' && document.activeElement !== $('#busca')) { ev.preventDefault(); $('#busca').focus(); }
  });

  // ---------- início ----------
  renderLista();
  const primeiroErro = D.problemas.findIndex((p) => p.severidade === 'erro');
  if (primeiroErro >= 0) abrirProblema(primeiroErro);
  else if (D.entradas.length) { abrirGalho(D.entradas[0].no); renderLista(); }
  else $('#vazioGrafo').innerHTML = '<div><b>Nenhum galho encontrado</b>Este projeto não tem página, rota, script nem HTML de entrada que dê para seguir.</div>';
  window.addEventListener('resize', () => aplicarCamera());
})();
</script>
</body>
</html>
